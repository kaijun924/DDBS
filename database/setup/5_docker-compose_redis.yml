services:
   redis:
      image: redis:latest
      container_name: cache
      command: ["redis-server", "--save", "900", "1", "--loglevel", "notice"]
      ports:
         - "6379:6379"
      volumes:
         - redis_data:/data
         # - $PWD/redis_cache-data:/var/lib/redis_cache
         # - $PWD/redis_cache.conf:/usr/local/etc/redis_cache/redis_cache.conf
      environment:
         - REDIS_REPLICATION_MODE=master
      networks:
         - redis_net
      restart: unless-stopped
volumes:
  redis_data:

networks:
  redis_net:
    external: true